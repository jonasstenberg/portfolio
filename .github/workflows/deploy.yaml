name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOMAIN: stenberg.io

jobs:
  install-and-lint:
    name: Install and run linter
    uses: ./.github/workflows/install-and-lint.yaml

  deploy:
    needs: install-and-lint
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install pnpm
        id: pnpm-install
        uses: pnpm/action-setup@v6

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build client
        run: pnpm build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.APP_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add SSH Key to known_hosts
        run: |
          ssh-keyscan -H ${{ env.DOMAIN }} >> ~/.ssh/known_hosts

      - name: Rsync to server
        run: |
          rsync --delete --exclude=health.json -azr ./apps/web/dist/ jonas@${{ env.DOMAIN }}:/usr/local/bin/portfolio

      - name: Restart Nginx
        run: |
          ssh -o StrictHostKeyChecking=no jonas@${{ env.DOMAIN }} 'sudo systemctl restart nginx'

  deploy-api:
    needs: install-and-lint
    name: Build and deploy CV API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/api

      - name: Build standalone binary
        run: bun run build
        working-directory: apps/api

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.APP_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add SSH Key to known_hosts
        run: |
          ssh-keyscan -H ${{ env.DOMAIN }} >> ~/.ssh/known_hosts

      - name: Rsync binary to server
        run: |
          rsync -az ./apps/api/dist/cv-api jonas@${{ env.DOMAIN }}:/usr/local/bin/cv-api/cv-api

      - name: Restart CV API
        run: |
          ssh -o StrictHostKeyChecking=no jonas@${{ env.DOMAIN }} 'sudo systemctl restart cv-api'
